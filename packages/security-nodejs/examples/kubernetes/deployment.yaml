apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          # Install @beacon-observability/nodejs in this application image.
          # No separate Security image, sidecar, or init container is required.
          image: registry.example.com/shop/orders:with-beacon-nodejs
          command:
            - node
            - /srv/app/server.mjs
          env:
            - name: NODE_OPTIONS
              value: --import @beacon-observability/nodejs/register
            - name: BEACON_SECURITY_ENABLED
              value: "true"
            - name: BEACON_SECURITY_NODE_INCLUDE
              value: /srv/app
            - name: BEACON_SECURITY_LOCAL_OUTPUT_ENABLED
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: orders
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=shop,deployment.environment.name=production
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.observability.svc:4318
          ports:
            - name: http
              containerPort: 3000
