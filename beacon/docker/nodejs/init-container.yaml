apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: beacon-nodejs
          image: ghcr.io/beacon-observability/beacon-nodejs:1.3.1
          command: [sh, -ec, 'cp -R /opt/beacon-nodejs/. /beacon/']
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: beacon
              mountPath: /beacon
      containers:
        - name: application
          # Must use a compatible Node.js 24 / Debian bookworm glibc runtime.
          image: registry.example.com/shop/orders:replace-me
          env:
            - name: NODE_OPTIONS
              value: --import=/opt/beacon-nodejs/node_modules/@beacon-observability/nodejs/register.mjs
            - name: OTEL_SERVICE_NAME
              value: orders
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
          volumeMounts:
            - name: beacon
              mountPath: /opt/beacon-nodejs
              readOnly: true
      volumes:
        - name: beacon
          emptyDir: {}
